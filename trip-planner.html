<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>旅程手冊 · 飛比特工具箱</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅程手冊">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/json,{"name":"旅程手冊","short_name":"旅程手冊","display":"standalone","background_color":"%23f8fafc","theme_color":"%230f766e","start_url":"./trip-planner.html","icons":[{"src":"data:image/svg+xml,%253Csvg xmlns=%2527http://www.w3.org/2000/svg%2527 viewBox=%25270 0 100 100%2527%253E%253Crect width=%2527100%2527 height=%2527100%2527 rx=%252722%2527 fill=%2527%25230f766e%2527/%253E%253Ctext x=%252750%2527 y=%252768%2527 font-size=%252756%2527 text-anchor=%2527middle%2527%253E%25E2%259C%2588%25EF%25B8%258F%253C/text%253E%253C/svg%253E","sizes":"512x512","type":"image/svg+xml"}]}'>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --line:#e2e8f0; --brand:#0f766e; --brand-soft:#ccfbf1; --brand-ink:#134e4a;
  --accent:#f97316; --danger:#dc2626; --ok:#16a34a; --warn:#b45309; --warn-bg:#fef3c7;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --nav-h:60px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  overscroll-behavior-y:contain;
}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
h1,h2,h3,h4{margin:0}
.hide{display:none!important}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
  display:flex;align-items:center;gap:8px;
}
.topbar select{
  flex:1;min-width:0;background:rgba(255,255,255,.15);border:none;color:#fff;
  font-size:15px;font-weight:700;padding:7px 9px;border-radius:9px;appearance:none;
}
.topbar select option{color:#000}
.icon-btn{
  background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;
  border-radius:9px;font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#facc15;flex-shrink:0;transition:.3s}
.sync-dot.live{background:#4ade80}.sync-dot.off{background:#f87171}

/* ---------- fx strip ---------- */
.fxstrip{
  background:var(--brand-ink);color:#d1fae5;font-size:12.5px;
  padding:6px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.fxstrip b{color:#fff}
.fxstrip input{
  width:74px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:6px;padding:3px 6px;font-size:12.5px;
}
.fxstrip .muted{color:#5eead4;font-size:11px}

/* ---------- layout ---------- */
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 0}
.page{display:none}.page.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card-pad{padding:13px 14px}
.sec-title{font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:.04em;margin:18px 4px 8px;text-transform:uppercase}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.btn:active{transform:scale(.97)}
.btn-brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn-block{display:flex;width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- chips / filters ---------- */
.chip-row{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.day{min-width:66px;flex-direction:column;display:flex;align-items:center;line-height:1.25;padding:6px 12px}
.chip.day .d{font-size:11px;font-weight:600;opacity:.8}
.chip.day .n{font-size:14px;font-weight:800}
.chip.day.today{border-color:var(--accent);box-shadow:0 0 0 2px #fed7aa}
.chip.day.today.on{background:var(--accent);border-color:var(--accent)}
.toggle-row{display:flex;gap:8px;margin:2px 0 10px}
.toggle{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2);text-align:center}
.toggle.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* ---------- itinerary ---------- */
.day-head{display:flex;align-items:center;gap:8px;margin:6px 4px 10px}
.day-head .big{font-size:19px;font-weight:900}
.day-head .sub{font-size:12.5px;color:var(--ink3);font-weight:600}
.day-head .route{margin-left:auto}

.spot{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
.spot.done{opacity:.62}
.spot.done .spot-name{text-decoration:line-through;text-decoration-color:var(--ink3)}
.spot-main{display:flex;gap:11px;padding:12px 12px 12px 14px}
.spot-cat{position:absolute;left:0;top:0;bottom:0;width:4px}
.cat-景點{background:#0ea5e9}.cat-餐食{background:#f97316}.cat-交通{background:#64748b}
.cat-購物{background:#a855f7}.cat-住宿{background:#14b8a6}.cat-其他{background:#94a3b8}
.spot-time{flex-shrink:0;font-size:13px;font-weight:800;color:var(--brand-ink);width:44px;padding-top:1px}
.spot-body{flex:1;min-width:0}
.spot-name{font-size:15.5px;font-weight:700;word-break:break-word}
.spot-meta{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;flex-wrap:wrap;gap:8px}
.spot-note{font-size:13px;color:var(--ink2);margin-top:6px;white-space:pre-wrap}
.spot-alert{margin-top:7px;background:var(--warn-bg);border:1px solid #fde68a;color:var(--warn);border-radius:9px;padding:7px 9px;font-size:12.5px;font-weight:600;white-space:pre-wrap}
.spot-alert b{display:block;font-size:11px;letter-spacing:.05em;opacity:.8}
.spot-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.spot-tag{font-size:11.5px;background:#f3e8ff;color:#7e22ce;border-radius:6px;padding:2px 7px;font-weight:600}
.spot-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.spot-links a,.spot-links button{font-size:12px;font-weight:700;border-radius:8px;padding:6px 10px;border:1px solid var(--line);background:#fff;color:var(--brand);display:inline-flex;gap:4px;align-items:center}
.spot-check{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.spot-check.on{background:var(--ok);border-color:var(--ok)}
.spot-foot{display:flex;gap:6px;border-top:1px dashed var(--line);padding:7px 12px;background:#fafcfc}
.spot-foot button{font-size:11.5px;color:var(--ink3);background:none;border:none;font-weight:600}

.transit{display:flex;align-items:center;gap:8px;margin:-2px 0 7px 22px;padding-left:12px;border-left:2px dotted var(--line)}
.transit button{font-size:11.5px;color:var(--ink3);background:#eef2f6;border:none;border-radius:7px;padding:4px 9px;font-weight:600}
.transit .info{font-size:11.5px;color:var(--ink2);font-weight:600}

/* ---------- generic list card ---------- */
.li{display:flex;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#f1f5f9;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.li-body{flex:1;min-width:0}
.li-title{font-weight:700;font-size:14.5px}
.li-sub{font-size:12px;color:var(--ink3);margin-top:2px;white-space:pre-wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f1f5f9;color:var(--ink2);margin-right:5px}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:#dcfce7;color:#15803d}

/* ---------- expenses ---------- */
.bal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:4px}
.bal{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:9px;text-align:center}
.bal .who{font-size:12px;font-weight:700;color:var(--ink2)}
.bal .amt{font-size:14px;font-weight:900;margin-top:2px}
.bal .amt.pos{color:var(--ok)}.bal .amt.neg{color:var(--danger)}
.bal .lbl{font-size:10px;color:var(--ink3)}
.settle-tx{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:#fff}
.settle-tx.paid{opacity:.5}
.settle-tx .flow{font-weight:800;font-size:13.5px}
.settle-tx .amt{margin-left:auto;font-weight:900;font-size:14px;text-align:right}
.settle-tx .amt small{display:block;font-weight:600;font-size:10px;color:var(--ink3)}
.settle-tx .mk{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff;color:var(--ink2);flex-shrink:0}
.settle-tx.paid .mk{background:var(--ok);color:#fff;border-color:var(--ok)}

/* ---------- FAB ---------- */
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:35;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  font-size:26px;box-shadow:0 6px 18px rgba(249,115,22,.45);display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe-b);height:calc(var(--nav-h) + var(--safe-b))}
.bnav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-size:10.5px;font-weight:700;padding-top:6px}
.bnav button .ic{font-size:19px;line-height:1}
.bnav button.on{color:var(--brand)}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:12px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;background:#fff}
.f textarea{min-height:62px;resize:vertical}
.f-row{display:flex;gap:9px}.f-row>.f{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.mchips input{width:auto}
.empty{text-align:center;color:var(--ink3);padding:38px 12px;font-size:13.5px}
.empty .ic{font-size:34px;display:block;margin-bottom:8px}
.banner{position:fixed;left:0;right:0;top:0;z-index:80;padding:11px 14px;color:#fff;font-size:13px;font-weight:600;text-align:center}
.barcode-big{font-family:"Libre Barcode 39",monospace;letter-spacing:2px}
.help{font-size:12px;color:var(--ink3);line-height:1.6}
.help code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:11px}

/* ---------- images ---------- */
.imgs{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.imgs .thumb{position:relative;width:66px;height:66px;flex-shrink:0}
.imgs .thumb img{width:100%;height:100%;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.imgs .thumb .x{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:var(--danger);color:#fff;font-size:12px;line-height:19px;text-align:center;font-weight:800}
.spot-photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.spot-photos img{width:86px;height:86px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.li-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.li-photos img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.filebtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed #cbd5e1;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;color:var(--ink2);background:#fafafa}
.filebtn input{display:none}
.img-view{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;padding:14px;flex-direction:column;gap:12px}
.img-view img{max-width:100%;max-height:82vh;border-radius:8px}
.img-view button{background:#fff;border:none;border-radius:9px;padding:9px 18px;font-weight:700}
</style>
</head>
<body>

<div class="topbar">
  <span class="sync-dot" id="syncDot" title="同步狀態"></span>
  <select id="tripSel" onchange="switchTrip(this.value)"></select>
  <button class="icon-btn" onclick="openTripMenu()" aria-label="行程設定">⚙️</button>
  <button class="icon-btn" onclick="openShare()" aria-label="分享">👥</button>
</div>
<div class="fxstrip" id="fxStrip"></div>

<div class="wrap">
  <!-- ITINERARY -->
  <section class="page active" id="pg-trip">
    <div class="chip-row" id="dayChips"></div>
    <div class="toggle-row">
      <div class="toggle" id="tgToday" onclick="toggleFilter('today')">📍 只看今天</div>
      <div class="toggle" id="tgDone" onclick="toggleFilter('done')">🙈 隱藏已完成</div>
    </div>
    <div id="itin"></div>
  </section>

  <!-- SHOPPING -->
  <section class="page" id="pg-shop">
    <div class="chip-row" id="shopFilter"></div>
    <div class="card" id="shopList"></div>
  </section>

  <!-- EXPENSES -->
  <section class="page" id="pg-money">
    <div id="moneyHead"></div>
    <div class="sec-title">結算（最少轉帳）</div>
    <div id="settle"></div>
    <div class="sec-title">所有支出</div>
    <div class="card" id="expList"></div>
  </section>

  <!-- COUPONS -->
  <section class="page" id="pg-coupon">
    <div class="card" id="couponList"></div>
  </section>

  <!-- MORE -->
  <section class="page" id="pg-more">
    <div class="sec-title">重要證件・訂房・班機</div>
    <div class="card" id="docList"></div>
    <div class="btn-row" style="margin:8px 0 4px"><button class="btn btn-sm btn-ghost" onclick="editDoc(null)">＋ 新增一筆</button></div>

    <div class="sec-title">當區注意事項</div>
    <div class="card card-pad help" id="areaAlerts"></div>
    <div class="btn-row" style="margin:8px 0 4px"><button class="btn btn-sm btn-ghost" onclick="editAreaAlert(null)">＋ 新增區域提醒</button></div>

    <div class="sec-title">打包清單</div>
    <div class="card" id="packList"></div>
    <div class="btn-row" style="margin:8px 0 4px">
      <button class="btn btn-sm btn-ghost" onclick="addPack()">＋ 加一項</button>
      <button class="btn btn-sm btn-ghost" onclick="resetPack()">帶入預設清單</button>
    </div>

    <div class="sec-title">攻略筆記</div>
    <div class="card" id="guideList"></div>
    <div class="btn-row" style="margin:8px 0 4px"><button class="btn btn-sm btn-ghost" onclick="editGuide(null)">＋ 新增攻略</button></div>

    <div class="sec-title">工具</div>
    <div class="card card-pad">
      <div class="btn-row">
        <button class="btn btn-sm" onclick="openSyncCode()">☁️ 我的雲端同步</button>
        <button class="btn btn-sm" onclick="openShare()">👥 好友共享</button>
        <button class="btn btn-sm" onclick="openFxSettings()">💱 匯率設定</button>
        <button class="btn btn-sm" onclick="openMembers()">🧑‍🤝‍🧑 成員</button>
        <button class="btn btn-sm" onclick="exportJSON()">⬇️ 匯出備份</button>
        <button class="btn btn-sm" onclick="importJSON()">⬆️ 匯入備份</button>
        <button class="btn btn-sm" onclick="newTrip()">✨ 新旅程</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTrip()">🗑 刪除此旅程</button>
      </div>
      <p class="help" style="margin-top:10px">換手機/瀏覽器看不到資料？用「☁️ 我的雲端同步」設一組代碼，每台裝置輸入同一組即可互通。<br>加到主畫面：iPhone Safari 分享鍵→「加入主畫面」；Android Chrome 選單→「安裝應用程式」。</p>
    </div>
  </section>
</div>

<button class="fab" id="fab" onclick="fabAction()">＋</button>

<nav class="bnav">
  <button data-pg="trip" class="on" onclick="nav('trip')"><span class="ic">🗺</span>行程</button>
  <button data-pg="shop" onclick="nav('shop')"><span class="ic">🛍</span>待買</button>
  <button data-pg="money" onclick="nav('money')"><span class="ic">💴</span>分帳</button>
  <button data-pg="coupon" onclick="nav('coupon')"><span class="ic">🎟</span>票券</button>
  <button data-pg="more" onclick="nav('more')"><span class="ic">☰</span>更多</button>
</nav>

<div id="modalRoot"></div>

<script>
/* ============================================================
   旅程手冊 · trip-planner.html  v1.1
   單檔 PWA。資料存 localStorage；每個旅程一律有 room，開 App 即
   自動雲端同步（Firebase Realtime DB）。跨裝置用「雲端同步碼」。
   與舊版 travel-planner.html 完全獨立（不同檔案、不同 storage key、
   不同 Firebase 專案）。
   v1.1：分帳改以外幣為主+每人先付/該分攤明細、今日路線修正、
        票券/優惠券可多圖、行程點/證件/攻略/區域提醒可放圖、
        自動雲端同步+同步碼、範本補上各段交通站點。
   ============================================================ */

/* ---------- FIREBASE（換成你新開的專案）---------- */
const FIREBASE_CONFIG = {

let _db=null,_ref=null,_room=null,_syncing=false,_saveT=null;
function fbReady(){ return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PASTE')<0; }
function initFB(){
  if(_db) return true;
  if(!fbReady()) return false;
  try{ _db=firebase.database(firebase.initializeApp(FIREBASE_CONFIG)); return true; }
  catch(e){ console.warn('FB init fail',e); return false; }
}
function setDot(s){ const d=document.getElementById('syncDot'); d.className='sync-dot'+(s==='live'?' live':s==='off'?' off':''); }

function joinRoom(room){
  if(!initFB()) return;
  _room=room; _ref=_db.ref('trips/'+room); setDot('connecting');
  _ref.on('value',snap=>{
    const data=snap.val(); if(!data) return;
    _syncing=true;
    try{
      const i=S.trips.findIndex(t=>t.id===data.id);
      if(i>=0) S.trips[i]=data; else S.trips.unshift(data);
      S.currentId=data.id; persist(); renderAll();
    }finally{ _syncing=false; }
    setDot('live');
  },()=>setDot('off'));
}
function pushRemote(){
  if(!_ref||_syncing) return;
  clearTimeout(_saveT);
  _saveT=setTimeout(()=>{
    const t=trip(); if(!t||!_ref) return;
    _ref.transaction(server=> server ? mergeTrip(server,t) : t, null, false)
      .catch(e=>{ setDot('off'); toast('雲端同步失敗：'+(e.message||'檢查網路或 Firebase 規則'),'#dc2626'); });
  },600);
}
// 把「我有哪些旅程 + 各自的 room」寫到 idx/<同步碼>，讓其他裝置輸入同步碼就能整批拉回
function pushIndex(){
  if(!S.syncCode||!initFB()) return;
  try{ _db.ref('idx/'+S.syncCode).set(S.trips.map(t=>({id:t.id,name:t.name||'',room:t.room||''}))); }catch(e){}
}
/* 合併策略：以 id 為鍵，兩邊union；時間戳較新的欄位優先 */
function byId(a,b){ const m=new Map(); (a||[]).forEach(x=>x&&x.id&&m.set(x.id,x)); (b||[]).forEach(x=>x&&x.id&&m.set(x.id,x)); return [...m.values()]; }
function mergeDays(sv,lo){
  const m=new Map(); (sv||[]).forEach(d=>m.set(d.date,{...d,spots:d.spots||[]}));
  (lo||[]).forEach(d=>{ if(m.has(d.date)){ const s=m.get(d.date); m.set(d.date,{...s,...d,spots:byId(s.spots,d.spots)}); } else m.set(d.date,d); });
  return [...m.values()].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function mergeTrip(sv,lo){
  if(!sv||sv.id!==lo.id) return lo;
  const poKey=p=>p.from+'|'+p.to;
  const po=[...(sv.paidOff||[]),...(lo.paidOff||[])].filter((p,i,a)=>a.findIndex(x=>poKey(x)===poKey(p))===i);
  return {...sv,...lo,
    days:mergeDays(sv.days,lo.days),
    shopping:byId(sv.shopping,lo.shopping),
    expenses:byId(sv.expenses,lo.expenses),
    coupons:byId(sv.coupons,lo.coupons),
    docs:byId(sv.docs,lo.docs),
    packing:byId(sv.packing,lo.packing),
    guides:byId(sv.guides,lo.guides),
    areaAlerts:byId(sv.areaAlerts,lo.areaAlerts),
    paidOff:po,
    members:[...new Set([...(sv.members||[]),...(lo.members||[])])]
  };
}

/* ---------- FX ---------- */
function rate(cur){
  if(!cur||cur==='TWD') return 1;
  const t=trip();
  if(t&&t.fxLocked&&t.fxLocked[cur]) return t.fxLocked[cur];
  return S.fx[cur]||FX_FALLBACK[cur]||1;
}
function toTWD(amt,cur){ return Math.round((Number(amt)||0)*rate(cur)); }
function sym(c){ return {JPY:'¥',TWD:'NT$',USD:'US$',KRW:'₩',EUR:'€',HKD:'HK$',THB:'฿'}[c]||c; }
function fmtT(n){ return 'NT$'+Math.round(n).toLocaleString(); }

async function fetchFX(){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/TWD');
    const j=await r.json();
    if(j&&j.rates){
      CURRENCIES.forEach(c=>{ if(c!=='TWD'&&j.rates[c]) S.fx[c]=+(1/j.rates[c]).toFixed(4); });
      S.fxAt=j.time_last_update_utc||new Date().toISOString();
      persist(); renderFxStrip(); if(document.getElementById('pg-money').classList.contains('active')) renderMoney();
    }
  }catch(e){ /* 離線就用上次或 fallback */ }
}

function wdOf(date,arr){ const g=new Date(date+'T00:00').getDay(); return isNaN(g)?'':arr[g]; }

/* ---------- ITINERARY ---------- */
// 去掉開頭 emoji/符號、括號說明，多地點只取第一個 → 讓 Google Maps 能定位
function cleanPlace(name){
  return String(name||'')
    .replace(/^[^\p{L}\p{N}]+/u,'')
    .replace(/[（(][^)）]*[)）]/g,'')
    .split(/[\/、,，]|　|\s+(?:or|OR|→|>)\s+/)[0]
    .trim();
}
// 早餐/回飯店/散策… 這類無法定位的字眼，畫路線時略過
const VAGUE_RE=/(早餐|午餐|晚餐|下午茶|點心|宵夜|自理|機上|集合|出發|抵達|返家|回飯店|check[\s-]?in|check[\s-]?out|退房|入住|散策|逛逛|逛街|掃貨|補貨|周邊|附近|待|看有|備案|之一|如有時間)/i;
function mapSearchUrl(s){
  if(s.mapUrl) return s.mapUrl;
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(cleanPlace(s.name)||s.name||'');
}
function dirUrl(from,to){
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(cleanPlace(from))+
    '&destination='+encodeURIComponent(cleanPlace(to))+'&travelmode=transit';
}
function dayRouteUrl(day){
  let names=(day.spots||[])
    .filter(s=>s.name && !VAGUE_RE.test(s.name))
    .map(s=>cleanPlace(s.name))
    .filter(n=>n.length>=2);
  names=names.filter((n,i)=>n!==names[i-1]);          // 去相鄰重複
  if(names.length<2) return null;
  if(names.length>10) names=names.slice(0,10);         // Google Maps 免費上限
  const enc=names.map(encodeURIComponent);
  let u='https://www.google.com/maps/dir/?api=1&travelmode=transit'
       +'&origin='+enc[0]+'&destination='+enc[enc.length-1];
  const way=enc.slice(1,-1).join('%7C');
  if(way) u+='&waypoints='+way;
  return u;
}
function matchedAreaAlerts(name){
  const t=trip(); if(!t||!t.areaAlerts) return [];
  return t.areaAlerts.filter(a=>a.area&&name&&name.indexOf(a.area)>=0);
}
function renderItin(){
  const t=trip(); const box=document.getElementById('itin');
  if(!t){ box.innerHTML='<div class="empty"><span class="ic">✈️</span>還沒有旅程，點右上 ⚙️ 新增</div>'; return; }
  const days=tripDays();
  const show= _filter.today ? days.filter(d=>d.date===todayStr())
            : days.filter(d=>d.date===_day);
  if(!show.length){ box.innerHTML='<div class="empty"><span class="ic">📅</span>今天不在旅程日期內</div>'; return; }
  box.innerHTML=show.map(day=>{
    let spots=[...(day.spots||[])].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    const total=spots.length;
    if(_filter.done) spots=spots.filter(s=>!s.done);
    const di=days.indexOf(day);
    const wd=wdOf(day.date,['週日','週一','週二','週三','週四','週五','週六']);
    const doneN=(day.spots||[]).filter(s=>s.done).length;
    const route=dayRouteUrl(day);
    let html=`<div class="day-head">
      <span class="big">Day ${di+1}</span>
      <span class="sub">${esc(day.date)} ${wd}　${doneN}/${total} 完成</span>
      ${route?`<a class="btn btn-sm route" href="${route}" target="_blank" rel="noopener">🗺 今日路線</a>`:''}
    </div>`;
    if(!spots.length){ html+='<div class="empty" style="padding:22px"><span class="ic">🌙</span>'+(_filter.done?'今天都完成了！':'這天還沒排行程')+'</div>'; return html; }
    spots.forEach((s,idx)=>{
      html+=renderSpot(s,day.date);
      const nx=spots[idx+1];
      if(nx) html+=renderTransit(s,nx,day.date);
    });
    return html;
  }).join('');
}
function renderSpot(s,date){

  const meta=[];

        ${(()=>{const ph=s.photos||(s.photo?[s.photo]:[]);return ph.length?`<div class="spot-photos">${ph.map(d=>`<img src="${d}" onclick="viewImg(this)">`).join('')}</div>`:'';})()}
        <div class="spot-links">${links.join('')}</div>

}
function renderTransit(a,b,date){
  const tr=a.transitAfter;
  if(!tr||!tr.mode){
    return `<div class="transit"><button onclick="editTransit('${date}','${a.id}')">＋ 交通</button>
      <a class="info" href="${dirUrl(a.name,b.name)}" target="_blank" rel="noopener" style="margin-left:auto">🧭 路線</a></div>`;
  }
  const ic={walk:'🚶',train:'🚃',subway:'🚇',bus:'🚌',taxi:'🚕',other:'➡️'}[tr.mode]||'➡️';
  const bits=[tr.mins?tr.mins+'分':'',tr.fare?('¥'+Number(tr.fare).toLocaleString()):'',tr.note].filter(Boolean);
  return `<div class="transit"><span class="info">${ic} ${esc(bits.join(' · ')||'移動')}</span>
    <button onclick="editTransit('${date}','${a.id}')">編輯</button>
    <a class="info" href="${dirUrl(a.name,b.name)}" target="_blank" rel="noopener" style="margin-left:auto">🧭 路線</a></div>`;
}
function toggleDone(date,id){
  const t=trip(); const d=t.days.find(x=>x.date===date); const s=d&&d.spots.find(x=>x.id===id);
  if(!s) return; s.done=!s.done; save(); renderDayChips(); renderItin();

/* ---------- IMAGE HELPERS ---------- */
let _imgBuf=[];               // 編輯 modal 期間的圖片緩衝（dataURL 陣列）
let _imgMulti=false;
function compressImg(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const w=im.width||760,h=im.height||760;
        const sc=Math.min(1,760/Math.max(w,h));
        const c=document.createElement('canvas');
        c.width=Math.round(w*sc); c.height=Math.round(h*sc);
        try{ c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.55)); }
        catch(e){ res(r.result); }
      };
      im.onerror=()=>res(r.result);
      im.src=r.result;
    };
    r.onerror=()=>res('');
    r.readAsDataURL(file);
  });
}
function imgPickerHTML(multi){
  _imgMulti=!!multi;
  return `<label class="filebtn">📷 ${multi?'加照片':'選擇照片'}
    <input type="file" accept="image/*" ${multi?'multiple':''} onchange="onPickImg(this)"></label>
    <div class="imgs" id="imgBufBox"></div>`;
}
async function onPickImg(input){
  const files=[...input.files]; if(!files.length) return;
  for(const f of files){
    const d=await compressImg(f);
    if(d){ if(_imgMulti) _imgBuf.push(d); else _imgBuf=[d]; }
  }
  input.value='';
  renderImgBuf();
  checkStorage();
}
function renderImgBuf(){
  const box=document.getElementById('imgBufBox'); if(!box) return;
  box.innerHTML=_imgBuf.map((d,i)=>`<div class="thumb"><img src="${d}" onclick="viewImg(this)"><span class="x" onclick="_imgBuf.splice(${i},1);renderImgBuf()">×</span></div>`).join('');
}
function viewImg(el){

  v.innerHTML=`<img src="${el.src}"><button onclick="this.parentElement.remove()">關閉</button>`;
  v.onclick=e=>{ if(e.target===v) v.remove(); };
  document.body.appendChild(v);
}
function checkStorage(){
  try{
    const kb=Math.round((JSON.stringify(S).length)/1024);
    if(kb>4200) toast('提醒：本機存檔已 '+kb+'KB，接近上限，照片別放太多（之後可改用雲端相簿）','#b45309');

}

function saveSpot(id,oldDate){
  const t=trip();

    id:id||uid(),
    time:document.getElementById('sp-time').value,
    name:document.getElementById('sp-name').value.trim(),

  };

    const od=t.days.find(x=>x.date===oldDate); if(od) od.spots=od.spots.filter(x=>x.id!==id);

/* ---------- EXPENSES + SETTLEMENT ---------- */
function members(){ const t=trip(); return (t&&t.members&&t.members.length)?t.members:['我']; }
function renderMoney(){
  const t=trip(); if(!t) return;
  const exp=t.expenses||[]; const mem=members();

  // 結算單位：全部同一種外幣 → 用該外幣直接算（不繞台幣，零換算誤差）；混幣 → 用台幣統一
  const curSet=[...new Set(exp.map(e=>e.cur||'JPY'))];
  const uni=curSet.length===1?curSet[0]:'TWD';
  const inUni=(amt,cur)=> uni===cur ? Number(amt)||0 : toTWD(amt,cur);   // 混幣時才會換台幣
  const uniSym=sym(uni);
  const showTwd=uni!=='TWD';
  const uniToTwd=n=> showTwd ? fmtT(n*rate(uni)) : '';
  const fmtUni=n=>`${uniSym}${Math.round(n).toLocaleString()}`;

  const total=exp.reduce((s,e)=>s+inUni(e.amount,e.cur),0);
  document.getElementById('moneyHead').innerHTML=`<div class="card card-pad">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><div style="font-size:12px;color:#94a3b8;font-weight:700">團體總支出</div>
      <div style="font-size:23px;font-weight:900">${fmtUni(total)}</div>
      ${showTwd?`<div style="font-size:12px;color:#94a3b8">≈ ${uniToTwd(total)}　（分帳匯率 ${uniSym}1=NT$${rate(uni).toFixed(3)}${t.fxLocked&&t.fxLocked[uni]?' 鎖定':' 即時'}）</div>`:''}
      <div style="font-size:11px;color:#94a3b8">${exp.length} 筆${curSet.length>1?'　⚠️ 有多種幣別，改用台幣統一結算':''}</div></div>
      <button class="btn btn-sm" onclick="openFxSettings()">調匯率</button>
    </div></div>`;

  // 每人：先付 / 該分攤 / 淨額（都用結算單位）
  const paid={},owe={};
  mem.forEach(m=>{paid[m]=0;owe[m]=0;});
  exp.forEach(e=>{
    const amt=inUni(e.amount,e.cur);
    if(paid[e.paidBy]==null){paid[e.paidBy]=0;owe[e.paidBy]=0;}
    paid[e.paidBy]+=amt;
    const parts=(e.splitWith&&e.splitWith.length)?e.splitWith:mem;
    if(e.splitMode==='custom'&&e.customSplits){
      Object.entries(e.customSplits).forEach(([m,v])=>{ if(owe[m]==null){owe[m]=0;paid[m]=0;} owe[m]+=inUni(v,e.cur); });
    }else{
      const each=amt/parts.length;
      parts.forEach(m=>{ if(owe[m]==null){owe[m]=0;paid[m]=0;} owe[m]+=each; });
    }
  });
  const bal={}; Object.keys(paid).forEach(m=>bal[m]=Math.round(paid[m]-owe[m]));

  document.getElementById('moneyHead').innerHTML+=`<div class="card card-pad">
    <div style="font-size:12px;color:#94a3b8;font-weight:700;margin-bottom:8px">每人結算（${uniSym}）</div>
    ${Object.keys(bal).map(m=>{
      const b=bal[m]; const cls=b>0?'pos':b<0?'neg':'';
      const tag=b>0?'該收回':b<0?'要付出':'剛好結清';
      return `<div style="display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)">
        <span style="font-weight:800;flex:0 0 68px">${esc(m)}</span>
        <span style="font-size:12px;color:var(--ink3);flex:1">先付 ${fmtUni(paid[m]||0)} ・ 該分攤 ${fmtUni(owe[m]||0)}</span>
        <span style="font-weight:900" class="${cls==='pos'?'':'neg'}"><span style="color:${b>0?'#16a34a':b<0?'#dc2626':'#94a3b8'}">${b>0?'+':''}${fmtUni(b)}</span></span>
      </div>
      <div style="text-align:right;font-size:11px;color:var(--ink3);margin:-2px 0 4px">${tag}${showTwd&&b!==0?'　≈ '+fmtT(Math.abs(b)*rate(uni)):''}</div>`;
    }).join('')}
  </div>`;

  // 最少轉帳
  const tx=minCashFlow(bal);
  document.getElementById('settle').innerHTML=`
    <p class="help" style="margin:0 0 8px 4px">「先付」剛好等於「該分攤」的人就結清了，不用再轉帳。剩下的用最少次數喬完：</p>
    ${tx.length?tx.map(x=>{
      const paidOff=(t.paidOff||[]).some(p=>p.from===x.from&&p.to===x.to);
      return `<div class="settle-tx ${paidOff?'paid':''}">
        <span class="flow">${esc(x.from)} → ${esc(x.to)}</span>
        <span class="amt">${fmtUni(x.amt)}${showTwd?`<small>≈ ${fmtT(x.amt*rate(uni))}</small>`:''}</span>
        <button class="mk" onclick="togglePaid('${esc(x.from)}','${esc(x.to)}',${x.amt})">${paidOff?'✓ 已還':'標記已還'}</button>
      </div>`;
    }).join(''):'<div class="empty" style="padding:20px"><span class="ic">✅</span>目前不用喬錢</div>'}`;

  document.getElementById('expList').innerHTML= exp.length? exp.slice().reverse().map(e=>{
    const parts=(e.splitWith&&e.splitWith.length)?e.splitWith:mem;
    const amt=inUni(e.amount,e.cur);
    let splitLine;
    if(e.splitMode==='custom'&&e.customSplits){
      splitLine='自訂：'+Object.entries(e.customSplits).map(([m,v])=>`${esc(m)} ${sym(e.cur)}${Number(v).toLocaleString()}`).join('、');
    }else{
      const each=amt/parts.length;
      splitLine=`${parts.map(esc).join('、')}　每人 ${fmtUni(each)}`;
    }
    return `<div class="li"><div class="li-body">
      <div class="li-title">${esc(e.title||'支出')}<span style="float:right">${sym(e.cur)}${Number(e.amount).toLocaleString()}</span></div>
      <div class="li-sub">${esc(e.paidBy)} 先付${e.cur!==uni?`　(≈ ${fmtUni(amt)})`:''}${e.date?`　·${e.date}`:''}</div>
      <div class="li-sub">分攤 → ${splitLine}</div>
      ${e.note?`<div class="li-sub">📝 ${esc(e.note)}</div>`:''}
      <div class="btn-row" style="margin-top:7px">
        <button class="btn btn-sm" onclick="editExpense('${e.id}')">編輯</button>
        <button class="btn btn-sm btn-danger" onclick="delExpense('${e.id}')">刪除</button>
      </div>
    </div></div>`;
  }).join(''):'<div class="empty"><span class="ic">💴</span>還沒有支出</div>';
}
function minCashFlow(bal){
  const cred=[],deb=[];
  Object.entries(bal).forEach(([m,v])=>{ if(v>0)cred.push([m,v]); else if(v<0)deb.push([m,-v]); });
  cred.sort((a,b)=>b[1]-a[1]); deb.sort((a,b)=>b[1]-a[1]);
  const tx=[]; let i=0,j=0;
  while(i<deb.length&&j<cred.length){
    const pay=Math.min(deb[i][1],cred[j][1]);
    if(pay>0.5) tx.push({from:deb[i][0],to:cred[j][0],amt:Math.round(pay)});
    deb[i][1]-=pay; cred[j][1]-=pay;
    if(deb[i][1]<=0.5)i++; if(cred[j][1]<=0.5)j++;
  }
  return tx;
}
function togglePaid(from,to,amt){
  const t=trip(); if(!t.paidOff)t.paidOff=[];
  const k=t.paidOff.findIndex(p=>p.from===from&&p.to===to);
  if(k>=0) t.paidOff.splice(k,1); else t.paidOff.push({from,to,amt});
  save(); renderMoney();
}

    <div class="f-row">

function saveExpense(id){
  const t=trip();
  const mode=document.querySelector('#e-mode button.on').dataset.v;
  const splitWith=[...document.querySelectorAll('#e-split input:checked')].map(x=>x.value);

  const obj={
    id:id||uid(),
    title:document.getElementById('e-title').value.trim(),
    cur:document.getElementById('e-cur').value,
    amount:+document.getElementById('e-amt').value||0,
    date:document.getElementById('e-date').value,
    paidBy:document.getElementById('e-paid').value,
    splitWith, splitMode:mode, customSplits:mode==='custom'?cs:null,
    note:document.getElementById('e-note').value.trim()
  };
  if(!obj.amount){ toast('請填金額','#dc2626'); return; }
  if(!splitWith.length){ toast('至少選一人分攤','#dc2626'); return; }
  if(id) t.expenses=t.expenses.map(x=>x.id===id?obj:x); else t.expenses.push(obj);
  save(); closeModal(); renderMoney();

function openSyncCode(){
  modal(`<h3>☁️ 我的雲端同步</h3>
   <p class="help">設一組只有你知道的代碼（例：<code>jen-japan-2026</code>）。你的每一台裝置／每個瀏覽器都輸入<b>同一組</b>，所有旅程就會互通。<br>朋友的共享連結是另一套，不受影響。</p>
   <div class="f"><label>同步代碼（英數，至少 6 碼）</label><input id="sc" value="${esc(S.syncCode||'')}" placeholder="jen-japan-2026"></div>
   <div class="btn-row"><button class="btn btn-brand btn-block" onclick="saveSyncCode()">設定並把本機旅程上傳雲端</button></div>
   <div class="btn-row" style="margin-top:8px"><button class="btn btn-block" onclick="pullSyncCode()">這是新裝置：把雲端旅程拉下來</button></div>
   ${!fbReady()?'<p class="help" style="color:#dc2626;margin-top:8px">尚未設定 Firebase，無法使用雲端同步。</p>':''}
   <div class="btn-row" style="margin-top:8px"><button class="btn btn-block" onclick="closeModal()">關閉</button></div>`);
}
function saveSyncCode(){
  const v=(document.getElementById('sc').value||'').trim();
  if(v.length<6){ toast('至少 6 碼','#dc2626'); return; }
  if(!initFB()){ toast('Firebase 未設定','#dc2626'); return; }
  S.syncCode=v; persist(); pushIndex();
  closeModal(); toast('已設定，本機旅程已上傳雲端');
}
function pullSyncCode(){
  const v=(document.getElementById('sc').value||'').trim();
  if(v.length<6){ toast('先填代碼','#dc2626'); return; }
  if(!initFB()){ toast('Firebase 未設定','#dc2626'); return; }
  _db.ref('idx/'+v).once('value').then(async snap=>{
    const list=snap.val();
    if(!list||!list.length){ toast('這組代碼雲端沒有旅程','#dc2626'); return; }
    let n=0;
    for(const it of list){
      if(!it.room) continue;
      try{
        const s=await _db.ref('trips/'+it.room).once('value');
        const d=s.val(); if(!d||!d.id) continue;
        const i=S.trips.findIndex(x=>x.id===d.id);
        if(i>=0) S.trips[i]=mergeTrip(S.trips[i],d); else S.trips.push(d);
        n++;
      }catch(e){}
    }
    S.syncCode=v;
    if(S.trips.length&&!S.trips.some(x=>x.id===S.currentId)) S.currentId=S.trips[0].id;
    persist(); renderAll(); syncRoom(); closeModal();
    toast('已拉下 '+n+' 筆旅程');
  }).catch(e=>toast('讀取失敗：'+(e.message||'檢查 Firebase 規則'),'#dc2626'));
}

/* ---------- TRIP CRUD ---------- */
function blankTrip(name){
  return {id:uid(),name:name||'新旅程',destination:'',startDate:'',endDate:'',
    members:['Jennifer','同伴A','同伴B'],
    days:[],shopping:[],expenses:[],paidOff:[],coupons:[],docs:[],packing:[],guides:[],areaAlerts:[],
    room:'r'+uid()+uid(),fxLocked:null};
}
function newTrip(){
  const n=prompt('旅程名稱？','新旅程'); if(n===null) return;
  const t=blankTrip(n.trim()||'新旅程'); S.trips.unshift(t); S.currentId=t.id; _day=null;
  save(); closeModal(); renderAll(); nav('trip');
  openTripMenu();
}
function deleteTrip(){
  if(S.trips.length<=1){ toast('至少要留一個旅程','#dc2626'); return; }
  if(!confirm('確定刪除「'+trip().name+'」？此裝置資料會移除。')) return;
  S.trips=S.trips.filter(t=>t.id!==S.currentId); S.currentId=S.trips[0].id; _day=null;
  save(); renderAll();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(trip(),null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(trip().name||'trip')+'.json'; a.click();
}
function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const o=JSON.parse(r.result); o.id=o.id||uid(); const i=S.trips.findIndex(t=>t.id===o.id);
      if(i>=0)S.trips[i]=o; else S.trips.unshift(o); S.currentId=o.id; save(); renderAll(); toast('已匯入'); }
      catch(e){ toast('檔案格式錯誤','#dc2626'); } };
    r.readAsText(f); };
  inp.click();
}

/* ---------- INIT ---------- */
function init(){
  load();
  initFB();
  const p=new URLSearchParams(location.search);
  const joining=p.get('join')&&fbReady();
  if(joining){
    joinRoom(p.get('join'));
    history.replaceState(null,'',location.pathname);
  }
  if(!S.trips.length&&!joining){
    // 第一次開、且不是透過共享連結進來：直接帶入這趟範本
    loadSeedSilently();
  }
  if(!S.currentId&&S.trips.length) S.currentId=S.trips[0].id;
  renderAll();
  syncRoom();
  fetchFX();
}
function loadSeedSilently(){
  // 與 loadSeed 相同但不 confirm / 不 toast（首次啟動用）
  const _c=window.confirm; window.confirm=()=>true;
  const _t=window.toast; window.toast=()=>{};
  try{ loadSeed(); }catch(e){ console.warn(e); S.trips.push(blankTrip('我的旅程')); }
  window.confirm=_c; window.toast=_t;
  closeModal();
}
window.addEventListener('DOMContentLoaded',init);
